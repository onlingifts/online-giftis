name: Build storefront v2
on:
  push:
    branches:
      - feature/storefront-v2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/storefront-v2
          fetch-depth: 0

      - name: Reconstruct storefront files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .storefront-payload/index_html.part* | base64 -d | gzip -d > index.html
          cat .storefront-payload/store_css.part* | base64 -d | gzip -d > assets/store.css
          cat .storefront-payload/store_js.part* | base64 -d | gzip -d > assets/store.js

          echo "816a833880b7d097e0a00c34662eea7a9c85a795d3e96b48ade955b0fe9c3658  index.html" | sha256sum -c -
          echo "c9331b4c80f938a4c1ae47fa37a00968f2e3e837f6eb843268711c9a631be100  assets/store.css" | sha256sum -c -
          echo "caeea1eb814dd9055cc460ce32229563ce66d7281e5011683f0faac26194a353  assets/store.js" | sha256sum -c -

          node --check assets/store.js
          python - <<'PY'
          from html.parser import HTMLParser
          class Parser(HTMLParser):
              pass
          Parser().feed(open("index.html", encoding="utf-8").read())
          print("HTML OK")
          PY

      - name: Commit clean storefront
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .storefront-payload
          rm -f .github/workflows/build-storefront-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build premium storefront v2"
          git push origin HEAD:feature/storefront-v2
