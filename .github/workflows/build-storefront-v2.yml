name: Build storefront v2
on:
  push:
    branches:
      - feature/storefront-v2
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/storefront-v2
      - name: Write storefront files
        env:
          CSS_B64: 
          JS_B64: 
          HTML_B64: [... ELLIPSIZATION ...]
        run: |
          mkdir -p assets
          printf '%s' "$CSS_B64" | base64 -d | gzip -d > assets/store.css
          printf '%s' "$JS_B64" | base64 -d | gzip -d > assets/store.js
          printf '%s' "$HTML_B64" | base64 -d | gzip -d > index.html
          node --check assets/store.js
          python - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser): pass
          P().feed(open("index.html", encoding="utf-8").read())
          print("HTML OK")
          PY
          rm -f .github/workflows/build-storefront-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/store.css assets/store.js .github/workflows/build-storefront-v2.yml
          git commit -m "Build storefront v2"
          git push origin HEAD:feature/storefront-v2
