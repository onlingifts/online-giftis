name: Independent Store API Cutover Check

on:
  push:
    branches:
      - cutover/independent-customer-api

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent customer API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://api.onlinegiftis.com/health | jq -e '.ok == true and .service == "onlinegiftis-store"' >/dev/null
          curl --fail --silent --show-error -H 'Origin: https://onlinegiftis.com' -D /tmp/products-headers.txt https://api.onlinegiftis.com/api/store/products -o /tmp/products.json
          grep -qi '^access-control-allow-origin: https://onlinegiftis.com' /tmp/products-headers.txt
          jq -e '.products | type == "array" and length > 0' /tmp/products.json >/dev/null
          curl --fail --silent --show-error -H 'Origin: https://onlinegiftis.com' https://api.onlinegiftis.com/api/store/config | jq -e '.config | type == "object"' >/dev/null
          curl --fail --silent --show-error -H 'Origin: https://onlinegiftis.com' https://api.onlinegiftis.com/api/store/categories | jq -e '.categories | type == "array" and length > 0' >/dev/null
          IMAGE="$(jq -r '[.products[] | select(.imageUrl != null)][0].imageUrl // empty' /tmp/products.json)"
          if [ -n "$IMAGE" ]; then
            curl --fail --silent --show-error -H 'Origin: https://onlinegiftis.com' "https://api.onlinegiftis.com$IMAGE" -o /tmp/product-image
            test -s /tmp/product-image
          fi
          curl --fail --silent --show-error https://admin.onlinegiftis.com/ | grep -q 'إدارة متجر الزبائن'
