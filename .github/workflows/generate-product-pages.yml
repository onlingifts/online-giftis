name: Generate product SEO pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-product-pages.mjs"
      - "scripts/merchant-feed.mjs"
      - "scripts/seo-localization.mjs"
      - "scripts/catalog-seo.mjs"
      - "products/index.html"
      - "scripts/search-landing-pages.mjs"
      - "assets/themes.js"
      - "assets/themes.css"
      - "assets/product-page.css"
      - "assets/product-page.js"
      - "assets/home.js"
      - "assets/pink-home.css"
      - "assets/store-fonts.css"
      - "scripts/build-storefront-assets.cjs"
      - "assets/seo-landing.css"
      - "assets/seo-landing.js"
      - "gifts-istanbul/**"
      - "custom-gifts-turkey/**"
      - "tr/istanbul-hediye/**"
      - "tr/kisiye-ozel-hediye/**"
      - ".github/workflows/generate-product-pages.yml"

permissions:
  contents: write

concurrency:
  group: product-seo-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate merchant feed
        run: node --test scripts/check-merchant-feed.mjs

      - name: Generate product pages
        run: node scripts/generate-product-pages.mjs

      - name: Validate search pages and language destinations
        run: node --test scripts/check-search-seo.mjs scripts/check-technical-seo.mjs

      - name: Validate official store identity and AI-search access
        run: node --test scripts/check-brand-identity.mjs

      - name: Build responsive storefront images
        run: |
          npm install --no-save --package-lock=false sharp@0.35.4
          node scripts/build-storefront-assets.cjs

      - name: Commit generated pages
        run: |
          git config user.name "online-gifts-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A feeds products tr/products product-images assets/previews assets/image-manifest.js index.html sitemap.xml image-sitemap.xml flowers-turkey flower-delivery-istanbul flower-delivery-gaziantep tr/cicek-teslimati tr/istanbul-cicek tr/gaziantep-cicek en/flower-delivery-turkey en/flower-delivery-istanbul en/flower-delivery-gaziantep gifts-istanbul gifts-gaziantep gifts-konya gifts-bursa custom-gifts-turkey tr/istanbul-hediye tr/gaziantep-hediye tr/konya-hediye tr/bursa-hediye tr/kisiye-ozel-hediye
          if git diff --cached --quiet; then
            echo "No product SEO changes to commit."
            exit 0
          fi
          git commit -m "Refresh product SEO pages"
          git push origin HEAD:main
