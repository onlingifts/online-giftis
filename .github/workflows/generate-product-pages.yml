name: Generate product SEO pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate-product-pages.mjs"
      - "assets/themes.js"
      - "assets/themes.css"
      - "assets/product-page.css"
      - "assets/product-page.js"
      - "assets/home.js"
      - "assets/pink-home.css"
      - "assets/store-fonts.css"
      - "scripts/build-storefront-assets.cjs"
      - "assets/seo-landing.css"
      - "assets/seo-landing.js"
      - "gifts-istanbul/**"
      - "custom-gifts-turkey/**"
      - "tr/istanbul-hediye/**"
      - "tr/kisiye-ozel-hediye/**"
      - ".github/workflows/generate-product-pages.yml"

permissions:
  contents: write

concurrency:
  group: product-seo-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Generate product pages
        run: node scripts/generate-product-pages.mjs

      - name: Build responsive storefront images
        run: |
          npm install --no-save --package-lock=false sharp@0.35.4
          node scripts/build-storefront-assets.cjs

      - name: Commit generated pages
        run: |
          git config user.name "online-gifts-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A products product-images assets/previews assets/image-manifest.js index.html sitemap.xml image-sitemap.xml
          if git diff --cached --quiet; then
            echo "No product SEO changes to commit."
            exit 0
          fi
          git commit -m "Refresh product SEO pages"
          git push origin HEAD:main
