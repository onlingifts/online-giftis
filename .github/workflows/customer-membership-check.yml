name: Customer membership frontend check

on:
  push:
    branches:
      - feat/customer-membership
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check auth client syntax
        run: node --check assets/customer-auth.js
      - name: Check product page inline scripts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('products/index.html','utf8');
          const re=/<script([^>]*)>([\s\S]*?)<\/script>/gi;
          let m,count=0;
          while((m=re.exec(html))){
            const attrs=m[1]||'';
            if(/\bsrc\s*=/.test(attrs)||/application\/ld\+json/i.test(attrs)) continue;
            new Function(m[2]);
            count++;
          }
          if(!count) throw new Error('No inline scripts checked');
          console.log('Validated inline scripts:',count);
          NODE
      - name: Verify membership hooks
        run: |
          grep -q 'memberDiscountRow' products/index.html
          grep -q 'customerAccountBtn' products/index.html
          grep -q 'خصم 200₺ على أول طلب' index.html
          grep -q 'İlk siparişe 200₺ indirim' tr/index.html
