name: Temporary customer-site verification

on:
  push:
    branches:
      - feature/live-customer-store

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate HTML structure and inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          assert html.count("<body>") == 1
          assert html.count("</body>") == 1
          assert html.count('id="productGrid"') == 1
          assert html.count('id="cartModal"') == 1
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          Path("/tmp/scripts").mkdir(exist_ok=True)
          for i, script in enumerate(scripts):
              Path(f"/tmp/scripts/{i}.js").write_text(script, encoding="utf-8")
          print(f"inline scripts: {len(scripts)}")
          PY
          for file in /tmp/scripts/*.js; do
            node --check "$file"
          done
