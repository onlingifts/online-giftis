<script>
(()=>{
  function applyLanguage(l){
    document.documentElement.lang=l;
    document.documentElement.dir=l==='tr'?'ltr':'rtl';
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
    document.querySelectorAll('.trn').forEach(el=>{el.innerHTML=el.dataset[l]||el.innerHTML});
    document.querySelectorAll('.trn-placeholder').forEach(el=>{el.placeholder=el.dataset[l+'Placeholder']||el.placeholder});
    try{localStorage.setItem('og_lang',l)}catch{}
  }
  document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.lang==='tr'){location.href='/tr/';return}
    applyLanguage('ar')
  }));
  const year=document.getElementById('year'); if(year) year.textContent=new Date().getFullYear();
})();
</script>
